# Fast mode only runs connectivity filtering and skips the final rename stage.
fast_mode = false

# Seed subscription sources.
# Tier 1: stable direct YAML outputs that are worth always ingesting.
# Keep this list conservative so the validation stage stays affordable.
subs = [
    "https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta.yaml",
    "https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml",
    "https://raw.githubusercontent.com/dongchengjie/airport/refs/heads/main/subs/merged/tested_within.yaml",
    "https://raw.githubusercontent.com/mfuu/v2ray/master/clash.yaml",
    "https://raw.githubusercontent.com/anaer/Sub/main/proxies.yaml",
    "https://raw.githubusercontent.com/xiaoji235/airport-free/main/clash/clashnodecc.txt",
    "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.meta.yml",
    "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml",
    "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
    "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
    "https://raw.githubusercontent.com/Barabama/FreeNodes/refs/heads/feat/ai-crawler-v2/nodes/merged.yaml",
]

# Discovery feeds can be repo pages, tree pages, or readme pages that link to
# frequently changing public subscription files.
# Tier 2: discovery only. These pages may expose more raw outputs over time, but
# they should not block the final release if one page changes structure.
discover_enabled = true
discover_feeds = [
    "https://github.com/snakem982/proxypool/tree/main/source",
    "https://github.com/dongchengjie/airport/tree/main/subs/merged",
    "https://github.com/mfuu/v2ray",
    "https://github.com/xiaoji235/airport-free/tree/main/clash",
    "https://github.com/anaer/Sub/tree/main",
    "https://github.com/Au1rxx/free-vpn-subscriptions/tree/main/output",
    "https://github.com/Pawdroid/Free-servers",
    "https://github.com/Barabama/FreeNodes/tree/feat/ai-crawler-v2/nodes",
]

# Supported placeholders: ${CN_REGION} ${CN_COUNTRY} ${COUNTRY}
# ${COUNTRYCODE} ${REGION} ${CITY} ${ISP} ${IP}
rename_node = true
rename_pattern = "${CN_REGION}_${CITY}_${ISP}"

# Optional extra pool inputs.
need_add_pool = false
pools = []

# Connectivity test grouping size.
test_group_size = 50

[artifacts]
enabled = true
dir = "artifacts"

[source_registry]
enabled = true
path = "artifacts/source_registry.json"

[connect_test]
url = "https://www.gstatic.com/generate_204"
expected = 204
timeout = 3000

# Hard gate for nodes entering validated/release pools.
# Passing the basic connectivity probe is not enough; nodes must also pass
# this Google-specific probe before being published.
[google_test]
enabled = true
url = "https://www.google.com/generate_204"
expected = 204
timeout = 5000

[speed_test]
enabled = false
url = "https://speed.cloudflare.com/__down?bytes=104857600"
timeout = 3000
