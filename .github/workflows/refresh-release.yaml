# Refresh generated subscription artifacts on demand and on a schedule.
name: refresh-release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: refresh-release
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    name: Refresh Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Refresh release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run

      - name: Verify downloaded mihomo core
        run: |
          chmod +x clash-meta/mihomo || true
          ./clash-meta/mihomo -v

      - name: Validate refreshed outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("artifacts/09_pipeline_summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          final_count = int(summary.get("final_release_proxy_count", 0) or 0)
          useful_count = int(summary.get("useful_proxy_count", 0) or 0)
          if useful_count <= 0 or final_count <= 0:
              raise SystemExit(
                  f"refresh-release produced no usable output: useful={useful_count}, final={final_count}"
              )
          print(
              f"validated refresh summary: useful={useful_count}, final={final_count}"
          )
          PY

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash.yaml v2rayn.txt v2rayn-links.txt conf/clash_release.yaml artifacts/09_pipeline_summary.json artifacts/10_source_registry.json artifacts/11_validated_pool.json artifacts/12_validated_pool_mihomo.json
          if git diff --cached --quiet; then
            echo "No artifact changes detected."
            exit 0
          fi
          git commit -m "chore: refresh clash outputs"
          git push origin HEAD:master
