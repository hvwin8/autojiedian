name: ci

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths-ignore:
      - "clash.yaml"
      - "artifacts/**"
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Pages builder
        run: |
          python -m py_compile scripts/build_pages.py
          python - <<'PY'
          import json
          from pathlib import Path

          registry_candidates = [
              Path("artifacts/10_source_registry.json"),
              Path("artifacts/source_registry.json"),
          ]
          registry_path = next((path for path in registry_candidates if path.exists()), None)
          if registry_path is None:
              raise SystemExit("no valid source registry input found for CI Pages validation")

          for path in [Path("artifacts/09_pipeline_summary.json"), registry_path]:
              if not path.exists():
                  raise SystemExit(f"required CI Pages input missing: {path}")
              text = path.read_text(encoding="utf-8")
              if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
                  raise SystemExit(f"merge conflict markers detected in {path}")
              json.loads(text)
              print(f"validated {path}")
          PY
          python scripts/build_pages.py --output-dir _site_ci --base-url https://hvwin8.github.io/autojiedian
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [Path("_site_ci/latest.json"), Path("_site_ci/summary.json"), Path("_site_ci/source-registry.json")]:
              if not path.exists():
                  raise SystemExit(f"expected Pages output missing: {path}")
              json.loads(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          PY
