name: pages

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  workflow_run:
    workflows: ["refresh-release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Pages inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [Path("artifacts/09_pipeline_summary.json")]
          registry_candidates = [
              Path("artifacts/10_source_registry.json"),
              Path("artifacts/source_registry.json"),
          ]
          markers = ("<<<<<<<", "=======", ">>>>>>>")

          registry_path = next((path for path in registry_candidates if path.exists()), None)
          if registry_path is None:
              raise SystemExit("no valid source registry input found for Pages build")

          for path in required + [registry_path]:
              if not path.exists():
                  if path in required:
                      raise SystemExit(f"required Pages input missing: {path}")
                  continue
              text = path.read_text(encoding="utf-8")
              if any(marker in text for marker in markers):
                  raise SystemExit(f"merge conflict markers detected in {path}")
              json.loads(text)
              print(f"validated {path}")
          PY

      - name: Build Pages artifact
        run: |
          python scripts/build_pages.py \
            --output-dir _site \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: |
      github.event_name == 'workflow_run' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
