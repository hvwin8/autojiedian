[package]
name = "proxrs"
version = "0.1.0"
edition = "2021"
authors = ["hvwin8"]
description = "Internal proxy parsing helpers for the autojiedian workspace."
license = "Apache-2.0"
repository = "https://github.com/hvwin8/autojiedian"
homepage = "https://hvwin8.github.io/autojiedian/"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
urlencoding = "2.1.3"
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
regex = "1.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
